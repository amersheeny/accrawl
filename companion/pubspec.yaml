name: accrawl_companion
description: Accrawl companion for viewing selected financial data, relaying bank SMS codes, and device-proxy crawls.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_secure_storage:
    path: vendor/flutter_secure_storage
  jni:
    path: vendor/jni
  jni_flutter:
    path: vendor/jni_flutter
  mobile_scanner:
    path: vendor/mobile_scanner
  shared_preferences_android:
    path: vendor/shared_preferences_android
  flutter_secure_storage_darwin: 0.4.0
  hooks: 2.1.0
  matcher: 0.12.20
  material_color_utilities: 0.13.1
  meta: 1.19.0
  package_config: 3.0.0
  record_use: 1.1.0
  test_api: 0.7.13
  vector_math: 2.4.2

flutter:
  uses-material-design: true
