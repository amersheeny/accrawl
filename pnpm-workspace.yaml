packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-ia32": true
  "@embedded-postgres/linux-ppc64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@google/genai": true
  "@node-rs/argon2": true
  embedded-postgres: true
  esbuild: true
  protobufjs: true
  sharp: true
  tesseract.js: true

injectWorkspacePackages: true
minimumReleaseAge: 0
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true
nodeVersion: 26.7.0

overrides:
  "@drizzle-team/brocli": ^0.12.0
  "@grpc/grpc-js": ^1.14.4
  brace-expansion: ^5.0.9
  esbuild: ^0.28.2
  fast-uri: ^4.1.2
  fast-xml-parser: ^5.10.1
  find-my-way: ^9.8.0
  form-data: ^4.0.6
  "drizzle-kit@0.31.10>@esbuild-kit/esm-loader": "-"
  glob: ^13.0.6
  "node-fetch@2.7.0>whatwg-url": ^17.1.0
  postcss: ^8.5.26
  protobufjs: ^8.7.2
  uuid: ^14.0.1

patchedDependencies:
  drizzle-kit@0.31.10: patches/drizzle-kit@0.31.10.patch
